services:
  kit-catalogue:
    build: .
    image: kit-catalogue:latest
    container_name: kit-catalogue
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${DATA_PATH:-${KITCATALOGUE_APPDATA:-./data}}:/data

services:
  kit-catalogue:
    image: ghcr.io/codechris-89/kitcatalogue:latest
    build:
      context: .
    container_name: kit-catalogue
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${DATA_PATH:-./data}:/data
